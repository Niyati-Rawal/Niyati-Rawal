<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- deep night sky -->
  <radialGradient id="sky" cx="50%" cy="30%" r="80%">
    <stop offset="0%"   stop-color="#060d28"/>
    <stop offset="50%"  stop-color="#030918"/>
    <stop offset="100%" stop-color="#010510"/>
  </radialGradient>

  <!-- moon glow -->
  <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#fffde0" stop-opacity="0.5"/>
    <stop offset="60%"  stop-color="#c8d8ff" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#4a7aff" stop-opacity="0"/>
  </radialGradient>

  <!-- pearl name gradient -->
  <linearGradient id="nameGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#80b0f8"/>
    <stop offset="22%"  stop-color="#c8e4ff"/>
    <stop offset="42%"  stop-color="#ffffff"/>
    <stop offset="58%"  stop-color="#e8f4ff"/>
    <stop offset="78%"  stop-color="#c0d8ff"/>
    <stop offset="100%" stop-color="#78a8f0"/>
  </linearGradient>

  <!-- gold shimmer line -->
  <linearGradient id="goldLine" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#8a6000" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#d4a020"/>
    <stop offset="50%"  stop-color="#ffe080"/>
    <stop offset="80%"  stop-color="#d4a020"/>
    <stop offset="100%" stop-color="#8a6000" stop-opacity="0"/>
  </linearGradient>

  <!-- aurora band -->
  <linearGradient id="aurora" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#0a1f6e" stop-opacity="0"/>
    <stop offset="20%"  stop-color="#1a4fd8" stop-opacity="0.18"/>
    <stop offset="40%"  stop-color="#8ab8ff" stop-opacity="0.35"/>
    <stop offset="55%"  stop-color="#c080f8" stop-opacity="0.2"/>
    <stop offset="75%"  stop-color="#1a4fd8" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#0a1f6e" stop-opacity="0"/>
  </linearGradient>

  <!-- horizon fade -->
  <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="50" gradientUnits="userSpaceOnUse">
    <stop offset="0%"   stop-color="#1a3a8a" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#010510" stop-opacity="0"/>
  </linearGradient>

  <!-- cloud gradient -->
  <linearGradient id="cloud1g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1a2e6e" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0a1838" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="cloud2g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#12204a" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#080f28" stop-opacity="0.15"/>
  </linearGradient>
  <linearGradient id="cloud3g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1e2a5a" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#0c1430" stop-opacity="0.18"/>
  </linearGradient>

  <!-- soft glow filter -->
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- name glow -->
  <filter id="nameGlow" x="-10%" y="-30%" width="120%" height="160%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- moon glow filter -->
  <filter id="moonFilter" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- star glow filter -->
  <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

</defs>

<!-- ═══════ BACKGROUND ═══════ -->
<rect width="900" height="300" fill="url(#sky)"/>

<!-- ═══════ AURORA BANDS ═══════ -->
<rect x="0" y="80" width="900" height="80" fill="url(#aurora)" opacity="0.7">
  <animate attributeName="opacity" values="0.4;0.9;0.5;0.8;0.4" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="y"       values="80;72;88;75;80"       dur="11s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="100" width="900" height="50" fill="url(#aurora)" opacity="0.4">
  <animate attributeName="opacity" values="0.2;0.6;0.3;0.5;0.2" dur="10s" begin="2s" repeatCount="indefinite"/>
</rect>

<!-- ═══════ MOON ═══════ -->
<!-- moon halo -->
<circle cx="760" cy="68" r="52" fill="url(#moonGlow)">
  <animate attributeName="r"       values="52;62;52;58;52" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.7;1;0.8;1;0.7"  dur="6s" repeatCount="indefinite"/>
</circle>
<!-- moon body -->
<circle cx="760" cy="68" r="28" fill="#f0f4e8" filter="url(#moonFilter)">
  <animate attributeName="opacity" values="0.88;1;0.92;1;0.88" dur="5s" repeatCount="indefinite"/>
</circle>
<!-- moon craters (detail) -->
<circle cx="752" cy="60" r="5"  fill="#d8dcc8" opacity="0.4"/>
<circle cx="768" cy="72" r="3.5" fill="#d0d4c0" opacity="0.3"/>
<circle cx="757" cy="76" r="2.5" fill="#d8dcc8" opacity="0.25"/>
<!-- moon shimmer slice -->
<path d="M748 52 Q755 45 768 50 Q760 48 748 52Z" fill="white" opacity="0.25"/>

<!-- ═══════ STARS — 60+ varying sizes ═══════ -->

<!-- bright big stars -->
<circle cx="45"  cy="18" r="1.8" fill="#fff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.4s" repeatCount="indefinite"/>
</circle>
<circle cx="130" cy="12" r="2.2" fill="#fff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.95;0.15;0.95" dur="4.8s" begin="0.6s" repeatCount="indefinite"/>
</circle>
<circle cx="225" cy="8"  r="1.9" fill="#eaf3ff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.85;0.2;0.85" dur="3.9s" begin="1.3s" repeatCount="indefinite"/>
</circle>
<circle cx="318" cy="15" r="1.5" fill="#d6eaff">
  <animate attributeName="opacity" values="0.72;0.1;0.72" dur="5.2s" begin="0.4s" repeatCount="indefinite"/>
</circle>
<circle cx="410" cy="6"  r="2.4" fill="#fff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.95;0.25;0.95" dur="5.5s" begin="2.2s" repeatCount="indefinite"/>
</circle>
<circle cx="500" cy="14" r="1.9" fill="#fff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.88;0.18;0.88" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
</circle>
<circle cx="592" cy="8"  r="1.6" fill="#eaf3ff">
  <animate attributeName="opacity" values="0.78;0.12;0.78" dur="3.7s" begin="1.6s" repeatCount="indefinite"/>
</circle>
<circle cx="680" cy="10" r="2.0" fill="#fff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.90;0.2;0.90" dur="4.6s" begin="0.3s" repeatCount="indefinite"/>
</circle>
<circle cx="840" cy="12" r="2.1" fill="#fff" filter="url(#starGlow)">
  <animate attributeName="opacity" values="0.92;0.1;0.92" dur="5.0s" begin="3.1s" repeatCount="indefinite"/>
</circle>

<!-- medium stars row 1 -->
<circle cx="22"  cy="38" r="1.2" fill="#c8e4ff">
  <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4.0s" begin="0.7s" repeatCount="indefinite"/>
</circle>
<circle cx="78"  cy="44" r="1.4" fill="#d8f0ff">
  <animate attributeName="opacity" values="0.65;0.1;0.65" dur="3.5s" begin="1.1s" repeatCount="indefinite"/>
</circle>
<circle cx="155" cy="36" r="1.7" fill="#fff">
  <animate attributeName="opacity" values="0.78;0.1;0.78" dur="5.7s" begin="2.6s" repeatCount="indefinite"/>
</circle>
<circle cx="198" cy="52" r="0.9" fill="#a0c4f8">
  <animate attributeName="opacity" values="0.50;0.05;0.50" dur="4.3s" begin="0.2s" repeatCount="indefinite"/>
</circle>
<circle cx="255" cy="40" r="1.3" fill="#d0e8ff">
  <animate attributeName="opacity" values="0.62;0.1;0.62" dur="3.8s" begin="1.8s" repeatCount="indefinite"/>
</circle>
<circle cx="340" cy="48" r="1.1" fill="#eaf3ff">
  <animate attributeName="opacity" values="0.58;0.08;0.58" dur="4.5s" begin="2.4s" repeatCount="indefinite"/>
</circle>
<circle cx="380" cy="30" r="1.5" fill="#d6eaff">
  <animate attributeName="opacity" values="0.70;0.12;0.70" dur="3.6s" begin="0.5s" repeatCount="indefinite"/>
</circle>
<circle cx="448" cy="42" r="1.9" fill="#fff">
  <animate attributeName="opacity" values="0.85;0.18;0.85" dur="4.0s" begin="1.9s" repeatCount="indefinite"/>
</circle>
<circle cx="525" cy="32" r="1.0" fill="#c0d8ff">
  <animate attributeName="opacity" values="0.55;0.08;0.55" dur="5.1s" begin="0.8s" repeatCount="indefinite"/>
</circle>
<circle cx="568" cy="50" r="1.6" fill="#eaf3ff">
  <animate attributeName="opacity" values="0.75;0.15;0.75" dur="3.9s" begin="3.0s" repeatCount="indefinite"/>
</circle>
<circle cx="612" cy="38" r="1.2" fill="#c8e4ff">
  <animate attributeName="opacity" values="0.60;0.1;0.60" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
</circle>
<circle cx="652" cy="28" r="1.4" fill="#d8eeff">
  <animate attributeName="opacity" values="0.68;0.12;0.68" dur="5.2s" begin="2.0s" repeatCount="indefinite"/>
</circle>
<circle cx="700" cy="46" r="1.1" fill="#eaf3ff">
  <animate attributeName="opacity" values="0.55;0.08;0.55" dur="3.7s" begin="0.6s" repeatCount="indefinite"/>
</circle>
<circle cx="858" cy="34" r="1.3" fill="#d0e8ff">
  <animate attributeName="opacity" values="0.65;0.1;0.65" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
</circle>
<circle cx="888" cy="20" r="1.6" fill="#fff">
  <animate attributeName="opacity" values="0.80;0.15;0.80" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
</circle>

<!-- small scattered stars -->
<circle cx="62"  cy="28" r="0.8" fill="#8ab8f0" opacity="0.55"/>
<circle cx="108" cy="56" r="0.7" fill="#c0d8ff" opacity="0.48"/>
<circle cx="168" cy="22" r="0.9" fill="#d8f0ff" opacity="0.52"/>
<circle cx="290" cy="24" r="0.8" fill="#a0c4f8" opacity="0.45"/>
<circle cx="350" cy="16" r="1.0" fill="#c8e4ff" opacity="0.58"/>
<circle cx="430" cy="56" r="0.7" fill="#d0e8ff" opacity="0.42"/>
<circle cx="470" cy="20" r="0.9" fill="#eaf3ff" opacity="0.55"/>
<circle cx="542" cy="62" r="0.8" fill="#c0d8ff" opacity="0.45"/>
<circle cx="580" cy="18" r="1.1" fill="#d8eeff" opacity="0.60"/>
<circle cx="630" cy="58" r="0.7" fill="#a0c4f8" opacity="0.42"/>
<circle cx="718" cy="22" r="0.9" fill="#c8e4ff" opacity="0.55"/>
<circle cx="808" cy="44" r="0.8" fill="#d0e8ff" opacity="0.48"/>
<circle cx="875" cy="55" r="0.7" fill="#8ab8f0" opacity="0.40"/>

<!-- pink-tinted girly stars -->
<circle cx="190" cy="16" r="1.1" fill="#f0c8e8">
  <animate attributeName="opacity" values="0.50;0.1;0.50" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
</circle>
<circle cx="490" cy="28" r="0.9" fill="#f0c0e0">
  <animate attributeName="opacity" values="0.45;0.08;0.45" dur="3.8s" begin="2.0s" repeatCount="indefinite"/>
</circle>
<circle cx="640" cy="16" r="1.2" fill="#f4d0ee">
  <animate attributeName="opacity" values="0.55;0.1;0.55" dur="5.0s" begin="0.5s" repeatCount="indefinite"/>
</circle>
<circle cx="820" cy="26" r="1.0" fill="#f0c8e8">
  <animate attributeName="opacity" values="0.50;0.1;0.50" dur="4.2s" begin="1.8s" repeatCount="indefinite"/>
</circle>

<!-- SHOOTING STAR -->
<line x1="0" y1="0" x2="0" y2="0" stroke="#e8f4ff" stroke-width="1.5" stroke-linecap="round" opacity="0">
  <animate attributeName="x1"      values="100;100;160;240;320" dur="8s" begin="2s"  repeatCount="indefinite"/>
  <animate attributeName="y1"      values="10;10;24;42;60"      dur="8s" begin="2s"  repeatCount="indefinite"/>
  <animate attributeName="x2"      values="130;130;195;275;355" dur="8s" begin="2s"  repeatCount="indefinite"/>
  <animate attributeName="y2"      values="26;26;42;62;80"      dur="8s" begin="2s"  repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;0.9;0.5;0;0;0"   dur="8s" begin="2s"  repeatCount="indefinite"/>
</line>
<line x1="0" y1="0" x2="0" y2="0" stroke="#c8e4ff" stroke-width="1.2" stroke-linecap="round" opacity="0">
  <animate attributeName="x1"      values="580;580;640;720;800" dur="11s" begin="6s" repeatCount="indefinite"/>
  <animate attributeName="y1"      values="8;8;20;38;58"        dur="11s" begin="6s" repeatCount="indefinite"/>
  <animate attributeName="x2"      values="608;608;672;752;832" dur="11s" begin="6s" repeatCount="indefinite"/>
  <animate attributeName="y2"      values="22;22;36;56;76"      dur="11s" begin="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;0.85;0.4;0;0;0"  dur="11s" begin="6s" repeatCount="indefinite"/>
</line>

<!-- ═══════ CLOUDS ═══════ -->

<!-- Cloud 1 — large, left side, drifts right -->
<g opacity="0.75">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 18,0; 0,0; -12,0; 0,0" dur="22s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.75;0.5;0.75;0.6;0.75" dur="22s" repeatCount="indefinite"/>
  <ellipse cx="95"  cy="82" rx="68" ry="22" fill="url(#cloud1g)"/>
  <ellipse cx="65"  cy="76" rx="42" ry="18" fill="url(#cloud1g)"/>
  <ellipse cx="130" cy="78" rx="50" ry="16" fill="url(#cloud1g)"/>
  <ellipse cx="108" cy="72" rx="35" ry="14" fill="url(#cloud1g)" opacity="0.6"/>
</g>

<!-- Cloud 2 — right side under moon, drifts left -->
<g opacity="0.6">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; -20,0; 0,0; 14,0; 0,0" dur="28s" begin="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.6;0.35;0.6;0.45;0.6" dur="28s" begin="4s" repeatCount="indefinite"/>
  <ellipse cx="820" cy="105" rx="75" ry="20" fill="url(#cloud2g)"/>
  <ellipse cx="790" cy="98"  rx="50" ry="17" fill="url(#cloud2g)"/>
  <ellipse cx="855" cy="100" rx="45" ry="15" fill="url(#cloud2g)"/>
</g>

<!-- Cloud 3 — mid, slow drift -->
<g opacity="0.5">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 25,0; 8,0; -10,0; 0,0" dur="35s" begin="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.5;0.28;0.5;0.38;0.5" dur="35s" begin="8s" repeatCount="indefinite"/>
  <ellipse cx="460" cy="60" rx="90" ry="18" fill="url(#cloud3g)"/>
  <ellipse cx="420" cy="54" rx="55" ry="16" fill="url(#cloud3g)"/>
  <ellipse cx="505" cy="56" rx="60" ry="14" fill="url(#cloud3g)" opacity="0.7"/>
  <ellipse cx="462" cy="50" rx="40" ry="12" fill="url(#cloud3g)" opacity="0.5"/>
</g>

<!-- Cloud 4 — bottom left, slow -->
<g opacity="0.55">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; 15,0; 0,0" dur="40s" begin="12s" repeatCount="indefinite"/>
  <ellipse cx="180" cy="255" rx="110" ry="25" fill="url(#cloud1g)" opacity="0.4"/>
  <ellipse cx="140" cy="248" rx="70"  ry="20" fill="url(#cloud1g)" opacity="0.35"/>
  <ellipse cx="230" cy="250" rx="80"  ry="18" fill="url(#cloud1g)" opacity="0.3"/>
</g>

<!-- Cloud 5 — bottom right -->
<g opacity="0.5">
  <animateTransform attributeName="transform" type="translate"
    values="0,0; -18,0; 0,0" dur="38s" begin="6s" repeatCount="indefinite"/>
  <ellipse cx="700" cy="258" rx="120" ry="24" fill="url(#cloud2g)" opacity="0.4"/>
  <ellipse cx="660" cy="252" rx="80"  ry="18" fill="url(#cloud2g)" opacity="0.3"/>
  <ellipse cx="740" cy="254" rx="70"  ry="16" fill="url(#cloud2g)" opacity="0.3"/>
</g>

<!-- ═══════ HORIZON GLOW ═══════ -->
<rect x="0" y="255" width="900" height="45" fill="url(#horizon)"/>
<path d="M0,268 C180,255 340,275 450,262 C560,249 720,270 900,260 L900,300 L0,300Z"
